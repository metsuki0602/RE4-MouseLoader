name: Build MouseLoader
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download 32-bit MinGW
      run: |
        Invoke-WebRequest -Uri "https://sourceforge.net/projects/mingw-w64/files/Toolchains%20targetting%20Win32/Personal%20Builds/mingw-builds/8.1.0/threads-posix/dwarf/i686-8.1.0-release-posix-dwarf-rt_v6-rev0.7z/download" -OutFile "mingw32.7z"

    - name: Extract MinGW
      run: |
        7z x mingw32.7z -oC:\mingw32

    - name: Add MinGW to PATH
      run: |
        echo "C:\mingw32\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify compiler is 32-bit
      run: g++ -v

    - name: Compile with g++ (32-bit)
      run: g++ main.cpp -o RE4-MouseLoader.exe -mwindows -luser32

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RE4-MouseLoader
        path: RE4-MouseLoader.exe
